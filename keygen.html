<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muss - Key Generator (1 device)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#fff; font-family:'Segoe UI',Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { background:#161b22; border:1px solid #30363d; border-radius:16px;
         padding:36px; width:100%; max-width:480px; text-align:center; }
  h1 { color:#e50914; font-size:26px; letter-spacing:3px; margin-bottom:6px; }
  .sub { color:#888; font-size:13px; margin-bottom:24px; }
  label { display:block; text-align:left; color:#aaa; font-size:13px; margin:14px 0 6px; }
  select, input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #30363d;
                  background:#0d1117; color:#fff; font-size:16px; outline:none; font-family:Consolas,monospace; }
  select:focus, input:focus { border-color:#e50914; }
  button { margin-top:24px; width:100%; padding:14px; border:none; border-radius:10px;
           background:#e50914; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; letter-spacing:1px; }
  .result { margin-top:26px; display:none; }
  .key { font-family:Consolas,monospace; font-size:19px; letter-spacing:2px;
         background:#0d1117; border:1px dashed #e50914; border-radius:10px;
         padding:16px 10px; word-break:break-all; color:#ff6b6b; }
  .exp { color:#aaa; font-size:13px; margin-top:12px; }
  .copybtn { margin-top:12px; background:#21262d; color:#fff; border:1px solid #30363d; font-size:14px; padding:10px; }
  .warn { color:#f85149; font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<div class="box">
  <h1>MUSS</h1>
  <div class="sub">Activation Key Generator &mdash; 1 device per key &mdash; keep private!</div>

  <label>Customer DEVICE ID (shown in the app)</label>
  <input type="text" id="dev" placeholder="e.g. A1B2C3D4E5F60718" style="text-transform:uppercase">

  <label>Key type</label>
  <select id="ktype">
    <option value="days">Valid for X days (from today)</option>
    <option value="date">Valid until a specific date</option>
  </select>

  <div id="daysWrap">
    <label>Number of days</label>
    <input type="number" id="days" value="30" min="1">
  </div>
  <div id="dateWrap" style="display:none">
    <label>Expiry date</label>
    <input type="date" id="date">
  </div>

  <label>How many keys?</label>
  <input type="number" id="qty" value="1" min="1" max="500">

  <button onclick="gen()">GENERATE</button>

  <div class="result" id="result">
    <div class="key" id="keyOut"></div>
    <div class="exp" id="expOut"></div>
    <button class="copybtn" onclick="copyKey()">📋 COPY KEY</button>
  </div>

  <div class="warn">⚠️ Key works ONLY on the device with this DEVICE ID. Anyone with this file can make free keys — never share it.</div>
</div>

<script>
var SECRET = "MU55-9XKD-2026-QP3M-7VCM";

function sha256(ascii) {
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var maxWord=Math.pow(2,32), result='';
  var words=[], asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[];
  var primeCounter=k.length;
  var isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(var i=0; i<313; i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(var i=0; i<ascii.length; i++){
    var j=ascii.charCodeAt(i); if(j>>8) return;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=((asciiBitLength/maxWord)|0);
  words[words.length]=(asciiBitLength);
  for(var j=0; j<words.length;){
    var w=words.slice(j,j+=16), oldHash=hash;
    hash=hash.slice(0,8);
    for(var i=0; i<64; i++){
      var w15=w[i-15], w2=w[i-2];
      var a=hash[0], e=hash[4];
      var temp1=hash[7]
        +(rr(e,6)^rr(e,11)^rr(e,25))
       +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(
            w[i-16]
            +(rr(w15,7)^rr(w15,18)^(w15>>>3))
            +w[i-7]
            +(rr(w2,17)^rr(w2,19)^(w2>>>10))
          )|0
        );
      var temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(var i=0; i<8; i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(var i=0; i<8; i++){
    for(var j=3; j+1; j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?'0':'')+b.toString(16);
    }
  }
  return result;
}

function sha8(s){ return sha256(s).substring(0,8).toUpperCase(); }

function makeKey(expSec, devId){
  var dev = sha8(SECRET + "|" + devId);
  var payload = ('0000000'+expSec.toString(16).toUpperCase()).slice(-8);
  var sig = sha8(SECRET + payload + dev);
  var key = payload + dev + sig;
  return key.match(/.{1,4}/g).join('-');
}

document.getElementById('ktype').onchange=function(){
  var t=document.getElementById('ktype').value;
  document.getElementById('daysWrap').style.display=(t==='days')?'block':'none';
  document.getElementById('dateWrap').style.display=(t==='date')?'block':'none';
};

function gen(){
  var dev=document.getElementById('dev').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!dev){ alert('Enter the customer DEVICE ID first'); return; }
  var qty=Math.max(1,Math.min(500,parseInt(document.getElementById('qty').value)||1));
  var now=Math.floor(Date.now()/1000), exp;
  if(document.getElementById('ktype').value==='days'){
    var d=Math.max(1,parseInt(document.getElementById('days').value)||30);
    exp=now+d*86400;
  } else {
    var dv=document.getElementById('date').value;
    if(!dv){ alert('Pick a date'); return; }
    exp=Math.floor(new Date(dv+'T23:59:59').getTime()/1000);
  }
  var keys=[];
  for(var i=0;i<qty;i++) keys.push(makeKey(exp+i, dev));
  document.getElementById('result').style.display='block';
  document.getElementById('keyOut').textContent=keys.join('\n');
  document.getElementById('expOut').textContent='Expires: '+new Date(exp*1000).toLocaleString()+'  •  Device: '+dev;
}

function copyKey(){
  navigator.clipboard.writeText(document.getElementById('keyOut').textContent).then(function(){ alert('Copied!'); });
}
</script>
</body>
</html>
