name: Build Muss iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter (manual, reliable)
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory $HOME/flutter
          $HOME/flutter/bin/flutter --version
      - name: Generate scaffolding
        run: flutter create . --platforms=ios --org com.muss --project-name muss
      - name: Configure app
        run: |
          sed -i '' 's/>muss</>Muss</' ios/Runner/Info.plist
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '13.0'/" ios/Podfile
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
      - run: flutter pub get
      - name: Install pods
        run: |
          cd ios
          pod install --repo-update || pod install
      - name: Build unsigned iOS app (direct xcodebuild)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace             -scheme Runner -configuration Release             -destination 'generic/platform=iOS'             -archivePath build/Runner.xcarchive             archive CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          cd build/Runner.xcarchive/Products/Applications
          rm -rf Payload Muss-unsigned.ipa
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr Muss-unsigned.ipa Payload
          mv Muss-unsigned.ipa "$GITHUB_WORKSPACE/build/Muss-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Muss-iOS-IPA
          path: build/Muss-unsigned.ipa
